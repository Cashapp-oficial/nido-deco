<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opción B · Nido</title>
<meta name="description" content="Objetos de deco en melamina hechos en Argentina.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>

.hero{position:relative;height:280vh;margin-top:-64px}
.escena{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.escena .foto{position:absolute;inset:0;background:url(img/hero.jpg) center/cover;transform:scale(1.25)}
.escena svg{position:absolute;inset:0;width:100%;height:100%}
.frase{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;opacity:0;padding:0 20px;background:rgba(20,16,12,.3)}
.frase h2{color:#fff;font-size:clamp(38px,6vw,84px);font-weight:400;max-width:900px}
.frase p{margin-top:14px;letter-spacing:.3em;text-transform:uppercase;font-size:12px}
.frase .btn{margin-top:28px;background:#fff;color:var(--tinta)}
.debajo{position:absolute;left:0;right:0;bottom:11vh;text-align:center;color:var(--tinta)}
.debajo div{font-size:13px;letter-spacing:.42em;text-transform:uppercase}
.debajo p{margin-top:8px;color:var(--suave);font-size:14px}
.debajo small{display:block;margin-top:26px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--suave);animation:baja 2.4s ease-in-out infinite}
@keyframes baja{50%{transform:translateY(6px)}}


.productos{display:grid;grid-template-columns:repeat(3,1fr);gap:56px 28px}
.card .fotos{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--crema);margin-bottom:16px}
.card .fotos img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s,transform 1.2s cubic-bezier(.2,.8,.2,1)}
.card .fotos img + img{opacity:0}
.card:hover .fotos img{transform:scale(1.04)}
.card:hover .fotos img + img{opacity:1}
.card .fila{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.card h3{font-size:18px}
.encabezado{display:flex;justify-content:space-between;align-items:end;margin-bottom:36px;gap:16px}
.encabezado h2{font-size:30px}
.encabezado p{color:var(--suave);font-size:13px}

.card .res{display:none}
@media (max-width:860px){ .productos{grid-template-columns:repeat(2,1fr);gap:40px 16px} .card h3{font-size:15px} .card .fila{flex-direction:column;gap:0} }
/* celular: un producto por pantalla, grande */
@media (max-width:600px){
  html{scroll-snap-type:y proximity}
  .productos{grid-template-columns:1fr;gap:64px}
  .card{scroll-snap-align:start;scroll-margin-top:76px}
  .card .fotos{aspect-ratio:3/4;margin-bottom:18px}
  .card .fila{flex-direction:row;justify-content:space-between;align-items:baseline}
  .card h3{font-size:22px}
  .card .precio{font-size:20px}
  .card .res{display:block;margin-top:10px;color:var(--texto);font-size:14.5px}
  .card .ver{display:inline-block;margin-top:14px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta);border-bottom:1px solid var(--tinta);padding-bottom:2px}
  .encabezado{flex-direction:column;align-items:start}
}
.card .ver{display:none}
@media (max-width:600px){ .card .ver{display:inline-block} }
@media (prefers-reduced-motion:reduce){ .flecha{animation:none} }
</style>
</head>
<body>

<header class="top"><div class="ancho">
  <a href="index.html" class="marca">NIDO</a>
  <a href="checkout.html" class="bolsa">Carrito<span data-contador>0</span></a>
</div></header>

<section class="hero" id="hero">
  <div class="escena">
    <div class="foto" id="fotoB"></div>
    <svg aria-hidden="true">
      <defs><mask id="hueco" maskUnits="userSpaceOnUse" x="-50000" y="-50000" width="100000" height="100000"><rect x="-50000" y="-50000" width="100000" height="100000" fill="#fff"/><text id="textoB" x="50%" y="45%" text-anchor="middle" dominant-baseline="central" font-family="Jost" font-weight="700" letter-spacing="-8" fill="#000">NIDO</text></mask></defs>
      <g id="veloB"><rect x="-50000" y="-50000" width="100000" height="100000" fill="#faf8f5" mask="url(#hueco)"/></g>
    </svg>
    <div class="debajo" id="debajoB"><div>Deco en melamina</div><p>Hecha a mano en Argentina</p><small>↓ Scrolleá</small></div>
    <div class="frase" id="fraseB"><h2>Pequeños detalles, grandes cambios.</h2><p>Deco en melamina · hecha a mano</p><a href="#productos" class="btn">Ver colección</a></div>
  </div>
</section>

<main class="ancho" id="productos">
  <div class="encabezado">
    <h2>Colección</h2>
    <p>12 cuotas sin interés · <b style="color:var(--acento);font-weight:500">35% OFF</b> por transferencia</p>
  </div>
  <div class="productos" id="lista"></div>
</main>

<footer class="pie"><div class="ancho">
  <span>© 2026 Nido · Deco en melamina</span>
  <span><a href="#" id="wa">WhatsApp</a> · <a href="#">Instagram</a></span>
</div></footer>

<script src="tienda.js"></script>
<script>
document.getElementById("lista").innerHTML = productos.map(p => `
  <a class="card" href="producto.html?id=${p.id}">
    <div class="fotos"><img src="${foto(p,1)}" alt="${p.nombre}" loading="lazy"><img src="${foto(p,3)}" alt="" loading="lazy"></div>
    <div class="fila"><h3>${p.nombre}</h3><span class="precio">${plata(p.precio)}</span></div>
    <div class="extra"><b>${plata(conTransferencia(p.precio))}</b> por transferencia</div>
    <p class="res">${p.resumen}</p>
    <span class="ver">Ver detalles →</span>
  </a>`).join("");

document.getElementById("wa").href = `https://wa.me/${WHATSAPP}`;

// al scrollear, la palabra crece hasta que la foto ocupa toda la pantalla
const texto = document.getElementById("textoB"), velo = document.getElementById("veloB"), fotoB = document.getElementById("fotoB");
const frase = document.getElementById("fraseB"), debajo = document.getElementById("debajoB"), heroB = document.getElementById("hero");
let centro = [0, 0];
function medir() {
  texto.setAttribute("font-size", Math.min(innerWidth * .3, 420));
  // el zoom se centra en la I: es la letra que deja un hueco parejo
  const i = texto.getExtentOfChar(1);
  centro = [i.x + i.width / 2, i.y + i.height / 2];
  pintar();
}
function pintar() {
  const avance = Math.min(1, Math.max(0, scrollY / (heroB.offsetHeight - innerHeight)));
  const t = Math.min(1, avance / .65), suave = t * t * t;
  const escala = 1 + suave * 80;
  const [cx, cy] = centro;
  velo.setAttribute("transform", `translate(${cx} ${cy}) scale(${escala}) translate(${-cx} ${-cy})`);
  velo.style.display = t >= 1 ? "none" : "";
  fotoB.style.transform = `scale(${1.25 - .25 * t})`;
  debajo.style.opacity = 1 - t * 4;
  frase.style.opacity = Math.max(0, Math.min(1, (avance - .62) / .2));
  frase.style.pointerEvents = avance > .7 ? "auto" : "none";
}
addEventListener("scroll", () => requestAnimationFrame(pintar), {passive:true});
addEventListener("resize", medir);
document.fonts.ready.then(medir); medir();
</script>
</body>
</html>
