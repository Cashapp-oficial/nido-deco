<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nido · Deco en melamina</title>
<meta name="description" content="Objetos de deco en melamina hechos en Argentina.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
.hero{min-height:calc(100vh - 64px);min-height:calc(100svh - 64px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 16px 70px;position:relative;overflow:hidden}
.nido{font-family:Jost;font-weight:700;line-height:.8;letter-spacing:-.02em;font-size:clamp(120px,30vw,420px);display:flex;user-select:none;cursor:default}
.nido span{display:block;background:url(img/hero.jpg) no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.nido span:hover{transform:translateY(-4%) rotate(-2deg)}
.nido span:nth-child(2):hover{transform:translateY(-4%) rotate(2deg)}
.bajada{margin-top:26px;font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:var(--tinta)}
.bajada + p{margin-top:10px;color:var(--suave);max-width:360px}
.flecha{position:absolute;bottom:22px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--suave);animation:baja 2.4s ease-in-out infinite}
@keyframes baja{50%{transform:translateY(6px)}}

.productos{display:grid;grid-template-columns:repeat(3,1fr);gap:56px 28px}
.card .fotos{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--crema);margin-bottom:16px}
.card .fotos img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s,transform 1.2s cubic-bezier(.2,.8,.2,1)}
.card .fotos img + img{opacity:0}
.card:hover .fotos img{transform:scale(1.04)}
.card:hover .fotos img + img{opacity:1}
.card .fila{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.card h3{font-size:18px}
.encabezado{display:flex;justify-content:space-between;align-items:end;margin-bottom:36px;gap:16px}
.encabezado h2{font-size:30px}
.encabezado p{color:var(--suave);font-size:13px}

.card .res{display:none}
@media (max-width:860px){ .productos{grid-template-columns:repeat(2,1fr);gap:40px 16px} .card h3{font-size:15px} .card .fila{flex-direction:column;gap:0} }
/* celular: un producto por pantalla, grande */
@media (max-width:600px){
  html{scroll-snap-type:y proximity}
  .productos{grid-template-columns:1fr;gap:64px}
  .card{scroll-snap-align:start;scroll-margin-top:76px}
  .card .fotos{aspect-ratio:3/4;margin-bottom:18px}
  .card .fila{flex-direction:row;justify-content:space-between;align-items:baseline}
  .card h3{font-size:22px}
  .card .precio{font-size:20px}
  .card .res{display:block;margin-top:10px;color:var(--texto);font-size:14.5px}
  .card .ver{display:inline-block;margin-top:14px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta);border-bottom:1px solid var(--tinta);padding-bottom:2px}
  .encabezado{flex-direction:column;align-items:start}
}
.card .ver{display:none}
@media (max-width:600px){ .card .ver{display:inline-block} }
@media (prefers-reduced-motion:reduce){ .flecha{animation:none} }
</style>
</head>
<body>

<header class="top"><div class="ancho">
  <a href="index.html" class="marca">NIDO</a>
  <a href="checkout.html" class="bolsa">Carrito<span data-contador>0</span></a>
</div></header>

<section class="hero" id="hero">
  <h1 class="nido" aria-label="Nido"><span>N</span><span>I</span><span>D</span><span>O</span></h1>
  <div class="bajada">Deco en melamina</div>
  <p>Objetos simples para tu casa, hechos a mano en Argentina.</p>
  <a href="#productos" class="flecha">↓ Ver productos</a>
</section>

<main class="ancho" id="productos">
  <div class="encabezado">
    <h2>Colección</h2>
    <p>12 cuotas sin interés · <b style="color:var(--acento);font-weight:500">35% OFF</b> por transferencia</p>
  </div>
  <div class="productos" id="lista"></div>
</main>

<footer class="pie"><div class="ancho">
  <span>© 2026 Nido · Deco en melamina</span>
  <span><a href="#" id="wa">WhatsApp</a> · <a href="#">Instagram</a></span>
</div></footer>

<script src="tienda.js"></script>
<script>
document.getElementById("lista").innerHTML = productos.map(p => `
  <a class="card" href="producto.html?id=${p.id}">
    <div class="fotos"><img src="${foto(p,1)}" alt="${p.nombre}" loading="lazy"><img src="${foto(p,3)}" alt="" loading="lazy"></div>
    <div class="fila"><h3>${p.nombre}</h3><span class="precio">${plata(p.precio)}</span></div>
    <div class="extra"><b>${plata(conTransferencia(p.precio))}</b> por transferencia</div>
    <p class="res">${p.resumen}</p>
    <span class="ver">Ver detalles →</span>
  </a>`).join("");

document.getElementById("wa").href = `https://wa.me/${WHATSAPP}`;

// una sola foto atraviesa las cuatro letras y se desliza con el mouse
const hero = document.getElementById("hero"), titulo = document.querySelector(".nido"), letras = titulo.querySelectorAll("span");
let mx = .5, my = .5;
function fondo() {
  const ancho = titulo.offsetWidth * 1.25, alto = ancho * 0.55;
  const sobraX = ancho - titulo.offsetWidth, sobraY = Math.max(0, alto - titulo.offsetHeight);
  letras.forEach(l => {
    l.style.backgroundSize = `${ancho}px ${alto}px`;
    l.style.backgroundPosition = `${-l.offsetLeft - sobraX * mx}px ${-sobraY * my}px`;
  });
}
hero.addEventListener("pointermove", e => {
  const r = hero.getBoundingClientRect();
  mx = (e.clientX - r.left) / r.width; my = (e.clientY - r.top) / r.height;
  requestAnimationFrame(fondo);
});
addEventListener("resize", fondo);
document.fonts.ready.then(fondo); fondo();
</script>
</body>
</html>
